name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend, translations and Pages export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.14.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test:ui
      - run: pnpm test:site
      - run: pnpm test:release
      - run: pnpm perf:test
      - run: pnpm build:pages
      - uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: apps/website/out
          retention-days: 7

  rust:
    name: Rust formatting, lint and fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config curl wget file libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev gdb
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-${{ runner.os }}-
      - name: Isolate local state and kubeconfig
        run: |
          mkdir -p "$RUNNER_TEMP/kubepit-ci"
          printf 'apiVersion: v1\nkind: Config\nclusters: []\ncontexts: []\nusers: []\n' > "$RUNNER_TEMP/kubepit-ci/kubeconfig"
          printf 'KUBEPIT_HOME=%s\nKUBECONFIG=%s\n' "$RUNNER_TEMP/kubepit-ci" "$RUNNER_TEMP/kubepit-ci/kubeconfig" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Context-budget tests include wall-clock guards. Run test cases serially
      # so competing fixture workloads do not consume their time on shared CPUs.
      - name: Run full serial Rust tests with bounded hang diagnostics
        run: bash scripts/ci/rust-tests.sh
      - name: Preserve Rust test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-diagnostics
          path: ${{ runner.temp }}/kubepit-rust-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
