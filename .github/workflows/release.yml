name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Existing immutable version tag to package (never moved)
        required: true
        default: v0.0.5
        type: string
      publish:
        description: Publish the complete validated asset set to GitHub Releases
        default: true
        type: boolean
      prerelease:
        description: Mark a newly created release as prerelease (existing flag is preserved)
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --max-old-space-size=4096
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      published_at: ${{ steps.release.outputs.published_at }}
      updater_enabled: ${{ steps.release.outputs.updater_enabled }}
      updater_public_key: ${{ steps.release.outputs.updater_public_key }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      # Automation comes from this workflow's commit. Application source is
      # checked out separately at the resolved, frozen tag commit in each job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/release/*.test.mjs
      - id: release
        run: node scripts/release/prepare.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
          # Tag-triggered community builds are previews; stable publication is an explicit dispatch choice.
          RELEASE_PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
          UPDATER_SIGNING_CONFIGURED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          APPLE_NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

  build:
    needs: prepare
    name: Package ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Preserve frozen source line endings on Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies from the frozen lockfile
        working-directory: source
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.14.4 --activate
          pnpm install --frozen-lockfile
          pnpm check:version
      - name: Install native Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: bash
        timeout-minutes: 20
        run: |
          # The hosted amd64 runner's Azure mirror can stall without producing
          # an APT error. Use the official archive without changing signing keys,
          # distribution suites, third-party repositories or ARM ports sources.
          if [ "$(dpkg --print-architecture)" = amd64 ]; then
            for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if [ -f "$source_file" ]; then
                sudo sed -i -E \
                  -e 's#https?://azure[.]archive[.]ubuntu[.]com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
                  -e 's#http://(archive|security)[.]ubuntu[.]com/ubuntu#https://\1.ubuntu.com/ubuntu#g' \
                  "$source_file"
              fi
            done
          fi
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          sudo timeout --signal=TERM --kill-after=15s 5m apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends build-essential pkg-config curl wget file libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libdbus-1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 rpm
      - name: Ensure Windows ARM64 C++ build tools
        if: matrix.id == 'windows-arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -property installationPath
          $armTools = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\arm64\cl.exe" -ErrorAction SilentlyContinue
          if (-not $armTools) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $process = Start-Process $installer -ArgumentList @('modify', '--installPath', "`"$installation`"", '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64', '--quiet', '--norestart', '--wait') -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "ARM64 build tool installation failed" }
          }
      - name: Set up Rust target
        shell: bash
        env:
          RELEASE_RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$RELEASE_RUST_TARGET"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            source/target/
          key: desktop-release-${{ matrix.id }}-${{ hashFiles('source/Cargo.lock') }}
      - name: Isolate application state
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kubepit-state"
          printf 'apiVersion: v1\nkind: Config\nclusters: []\ncontexts: []\nusers: []\n' > "$RUNNER_TEMP/kubepit-state/kubeconfig"
          printf 'KUBEPIT_HOME=%s\nKUBECONFIG=%s\n' "$RUNNER_TEMP/kubepit-state" "$RUNNER_TEMP/kubepit-state/kubeconfig" >> "$GITHUB_ENV"
      - name: Build, sign when configured, and verify exact packages
        run: node scripts/release/build.mjs
        env:
          RELEASE_TARGET: ${{ matrix.id }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_UPDATER_ENABLED: ${{ needs.prepare.outputs.updater_enabled }}
          RELEASE_UPDATER_PUBLIC_KEY: ${{ needs.prepare.outputs.updater_public_key }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: release-target/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      RELEASE_PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
      RELEASE_UPDATER_ENABLED: ${{ needs.prepare.outputs.updater_enabled }}
      RELEASE_UPDATER_PUBLIC_KEY: ${{ needs.prepare.outputs.updater_public_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-input
          merge-multiple: true
      - name: Verify complete set and generate manifest, checksums and Homebrew cask
        run: node scripts/release/assemble.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: complete-desktop-release
          path: release-output/
          # A publish-only retry reuses the six native artifacts and may
          # replace this internal staging copy; release assets are never replaced.
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish verified release assets (manifest last)
        if: github.event_name == 'push' || inputs.publish
        run: node scripts/release/publish.mjs
      # GITHUB_TOKEN-created release events do not start other workflows.
      # An explicit dispatch refreshes the website's verified download snapshot.
      - name: Refresh GitHub Pages downloads
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main -F require_packages=true
