[package]
name = "kubepit-core"
version = "0.1.0"
description = "Kubepit core: cluster registry, kubeconfig handling and Kubernetes access."
edition = "2021"
rust-version = "1.89"
license = "MIT"

[lib]
# `cargo bench -p kubepit-core -- <criterion flags>` would hand the flags to
# the unit tests' libtest harness too, which rejects them.
bench = false

[dependencies]
kube = { version = "4.2", default-features = false, features = ["client", "config", "runtime", "ws", "rustls-tls", "ring", "gzip", "oidc", "http-proxy", "socks5", "jsonpatch"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
# Deserialises RFC 6902 patches coming from the UI (`resource_patch` with `patch_type: json`).
json-patch = "4"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
# `rc`: the shared objects of `WatchBatch` (`Arc<Value>`) serialise as values.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dirs = "6"
base64 = "0.22"
flate2 = "1"
# `/regex/` name patterns in fleet search (linear-time matching).
regex = "1"
# Raw GETs through the API server: the service proxy (Prometheus queries)
# and `/openapi/v3` documents (already in kube's tree).
http = "1"
# Assistant base URLs must parse the same way under the WHATWG parser the
# HTTP client uses (already in the workspace's tree).
url = "2"
# Authenticated Prometheus: HTTP/1.1, and TLS for `https` services, over an
# in-process port-forward stream (all already in kube's tree).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls-native-certs = "0.8"
# Connectivity: kubeconfig file watching, OS credential store (keychain mode).
notify = "8"
keyring = "4"
# Persistent history (audit log, events, changes): local SQLite, WAL mode.
rusqlite = { version = "0.32", features = ["bundled"] }
# Assistant providers (Anthropic, OpenAI-compatible, Ollama) over HTTPS/SSE.
# Already in the tree through `tauri-plugin-updater`; `rustls-no-provider`
# keeps the ring-based rustls stack above (no aws-lc-rs, no native-tls): the
# client gets a preconfigured ring `ClientConfig` (`ai/provider.rs`).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }

[dev-dependencies]
tempfile = "3"
# Paused time (`start_paused`) for the watch flow-control tests.
tokio = { version = "1", features = ["test-util"] }
# Benchmarks (`benches/`, large-cluster performance harness); dev-only.
criterion = { version = "0.7", features = ["async_tokio"] }

[target.'cfg(unix)'.dev-dependencies]
# Peak RSS of the e2e bench (`getrusage`); already in the tree through tokio.
libc = "0.2"

[[bench]]
name = "watch"
harness = false

[[bench]]
name = "metrics_history"
harness = false

[[bench]]
name = "watchers"
harness = false

[[bench]]
name = "search_proxies"
harness = false

[[bench]]
name = "e2e"
harness = false
